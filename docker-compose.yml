services:
  postgres:
    image: postgres:17-alpine
    container_name: code-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeconnect}
      POSTGRES_DB: ${POSTGRES_DB:-codeconnect}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-codeconnect} -d $${POSTGRES_DB:-codeconnect}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
